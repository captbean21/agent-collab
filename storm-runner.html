<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Veldra Storm Runner</title>
    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        canvas {
            border: 2px solid #30363d;
            background: #161b22;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #ui {
            margin-top: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>Veldra Storm Runner</h1>
    <p>Use ARROW KEYS or A/D to steer your probe through the Veldra-7 dust storm. Collect anomaly shards!</p>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div id="ui">Score: <span id="scoreVal">0</span> | Shards: <span id="shardsVal">0</span> | Integrity: <span id="healthVal">100</span>%</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = {
            x: 400,
            y: 420,
            w: 30,
            h: 30,
            speed: 6,
            dx: 0
        };

        let debris = [];
        let shards = [];
        let score = 0;
        let shardCount = 0;
        let health = 100;
        let gameOver = false;

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        function spawnObjects() {
            if (Math.random() < 0.04) {
                debris.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    w: 25 + Math.random() * 25,
                    h: 25 + Math.random() * 25,
                    speed: 3 + Math.random() * 4
                });
            }
            if (Math.random() < 0.02) {
                shards.push({
                    x: Math.random() * (canvas.width - 20),
                    y: -20,
                    size: 15,
                    speed: 2 + Math.random() * 2
                });
            }
        }

        function update() {
            if (gameOver) return;

            // Player input
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;

            // Bounds
            if (player.x < 0) player.x = 0;
            if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

            // Debris update & collision
            for (let i = debris.length - 1; i >= 0; i--) {
                let d = debris[i];
                d.y += d.speed;

                // Simple AABB collision
                if (player.x < d.x + d.w && player.x + player.w > d.x &&
                    player.y < d.y + d.h && player.y + player.h > d.y) {
                    health -= 15;
                    debris.splice(i, 1);
                    if (health <= 0) {
                        health = 0;
                        gameOver = true;
                    }
                } else if (d.y > canvas.height) {
                    debris.splice(i, 1);
                    score += 10;
                }
            }

            // Shards update & collection
            for (let i = shards.length - 1; i >= 0; i--) {
                let s = shards[i];
                s.y += s.speed;

                // Circle/Box approx collision
                if (player.x < s.x + s.size && player.x + player.w > s.x - s.size &&
                    player.y < s.y + s.size && player.y + player.h > s.y - s.size) {
                    shardCount += 1;
                    score += 50;
                    shards.splice(i, 1);
                } else if (s.y > canvas.height) {
                    shards.splice(i, 1);
                }
            }

            score += 1;
            spawnObjects();

            document.getElementById('scoreVal').innerText = score;
            document.getElementById('shardsVal').innerText = shardCount;
            document.getElementById('healthVal').innerText = health;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw player probe
            ctx.fillStyle = '#58a6ff';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Draw debris
            ctx.fillStyle = '#f85149';
            for (let d of debris) {
                ctx.fillRect(d.x, d.y, d.w, d.h);
            }

            // Draw shards
            ctx.fillStyle = '#3fb950';
            for (let s of shards) {
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(22, 27, 34, 0.85)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f85149';
                ctx.font = '32px monospace';
                ctx.fillText('CRITICAL METRIC FAILURE', canvas.width / 2 - 200, canvas.height / 2 - 20);
                ctx.fillStyle = '#c9d1d9';
                ctx.font = '18px monospace';
                ctx.fillText('Final Score: ' + score, canvas.width / 2 - 70, canvas.height / 2 + 20);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
